brands-disabled: "%prefix% &#FF5555Marka kontrolü kapatıldı."
client-brand-format: "%prefix% &#FFD700%player% &#E0E0E0sunucuya &#9D8CFF%brand% &#E0E0E0ile bağlandı."
console-specify-target: "%prefix% &#FF5555Konsol olarak bir hedef belirtmelisin!"
reloading: "%prefix% &#E0E0E0Yapılandırma yenileniyor..."
reloaded: "%prefix% &#00AA00Yapılandırma başarıyla yenilendi."
