player-not-found: "%prefix% &#FF5555Oyuncu bulunamadı veya muaf!"
player-not-this-server: "%prefix% &#FF5555Oyuncu bu sunucuda değil!"
sender-not-found: "%prefix% &cYou cannot be exempt to use this command!"
spectate-return: "<click:run_command:/grim stopspectating><hover:show_text:\"/grim stopspectating\"> %prefix% &#FFD700Önceki konuma dönmek için buraya tıkla </hover></click>"
