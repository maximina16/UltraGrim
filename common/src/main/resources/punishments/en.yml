# Migrated from GrimAC + UltraGrim check categories.
# %check_name% %description% %vl% %verbose% %player%
# [alert] [webhook] [proxy] [log]

Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "100:40 [alert]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
      - "100:100 [log]"
  Knockback:
    remove-violations-after: 300
